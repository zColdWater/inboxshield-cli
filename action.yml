name: "InboxShield v7.0 — 6-Phase Email DNS Deliverability Audit"
description: "Audit NS/SOA consistency, MX redundancy, recursive SPF 10-lookup & CIDR layers (RFC 7208), 24 DKIM selectors, strict RFC 7489 DMARC syntax, MTA-STS & BIMI in CI."
author: "OmniForge Studio"
branding:
  icon: "shield"
  color: "green"

inputs:
  domain:
    description: "Sending domain to audit (e.g. yourdomain.com)"
    required: true
  min-score:
    description: "Minimum deliverability health score (0-100) required to pass CI"
    required: false
    default: "70"
  fail-on-spf-permerror:
    description: "Fail workflow if recursive SPF DNS lookups exceed RFC 7208 limit (>10)"
    required: false
    default: "true"
  fail-on-missing-dmarc:
    description: "Fail workflow if _dmarc TXT record is missing"
    required: false
    default: "true"

outputs:
  score:
    description: "Deliverability health score (0-100)"
    value: ${{ steps.audit.outputs.score }}
  grade:
    description: "Deliverability letter grade (A+ to F)"
    value: ${{ steps.audit.outputs.grade }}
  spf-lookups:
    description: "Recursive SPF DNS lookup count"
    value: ${{ steps.audit.outputs.spf_lookups }}
  dmarc-policy:
    description: "Detected DMARC policy (reject, quarantine, none, missing)"
    value: ${{ steps.audit.outputs.dmarc_policy }}

runs:
  using: "composite"
  steps:
    - name: Run InboxShield v7.0 Email DNS Audit
      id: audit
      shell: bash
      env:
        INPUT_DOMAIN: ${{ inputs.domain }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_FAIL_SPF: ${{ inputs.fail-on-spf-permerror }}
        INPUT_FAIL_DMARC: ${{ inputs.fail-on-missing-dmarc }}
      run: |
        node -e '
        import { execFileSync } from "node:child_process";
        import fs from "node:fs";

        const domain = process.env.INPUT_DOMAIN.trim();
        const minScore = Number(process.env.INPUT_MIN_SCORE || 70);
        const failSpf = process.env.INPUT_FAIL_SPF !== "false";
        const failDmarc = process.env.INPUT_FAIL_DMARC !== "false";

        const raw = execFileSync(process.execPath, [process.env.GITHUB_ACTION_PATH + "/bin/inboxshield.mjs", "check", domain, "--json"], { encoding: "utf8" });
        const r = JSON.parse(raw);

        const setOut = (k, v) => {
          if (process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
        };
        setOut("score", r.score);
        setOut("grade", r.grade);
        setOut("spf_lookups", r.spf?.lookups ?? 0);
        setOut("dmarc_policy", r.dmarc?.policy || "missing");

        const summary = [
          `## InboxShield v7.0 Email DNS Audit — \`${r.domain}\``,
          ``,
          `| Protocol Check | Result |`,
          `| :--- | :--- |`,
          `| **Health Score** | **${r.score}/100 (Grade ${r.grade})** |`,
          `| **Mail Provider** | ${r.provider} (${r.mxCount} MX host(s)) |`,
          `| **SPF (RFC 7208)** | ${r.spf?.lookups ?? 0}/10 lookups (${r.spf?.ip4Count ?? 0} IPv4 + ${r.spf?.ip6Count ?? 0} IPv6 CIDRs, \`${r.spf?.qualifier || "missing"}\`) |`,
          `| **DMARC (RFC 7489)** | \`${r.dmarc?.policy || "missing"}\` (${(r.dmarc?.syntaxErrors || []).length} syntax error(s)) |`,
          `| **DKIM (24 Selectors)** | ${(r.dkimSelectorsFound || []).join(", ") || "None detected in 24 standard selectors"} |`,
          `| **MTA-STS / TLS-RPT / BIMI** | ${r.mtaSts ? "Yes" : "No"} / ${r.tlsRpt ? "Yes" : "No"} / ${r.bimi ? "Yes" : "No"} |`,
          ``,
          ...(r.issues?.length ? ["### Actionable Findings", ...r.issues.map(i => `- ${i}`), ""] : []),
          `> Free 6-Phase Web Diagnostic: https://inbox-checker.appwrite.network/?domain=${encodeURIComponent(r.domain)} · Need exact copy-paste 5-registrar DNS fixes + merged SPF flattening? [Single-Domain Emergency Fix ($2 Launch Special, reg. $9)](https://omnipulse-x402.appwrite.network/go/gumroad/inboxshield)`,
        ].join("\n") + "\n";

        if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
        console.log(summary);

        const errors = [];
        if (r.score < minScore) errors.push(`Score ${r.score} is below min-score ${minScore}`);
        if (failSpf && (r.spf?.lookups ?? 0) > 10) errors.push(`SPF PermError: ${r.spf.lookups}/10 DNS lookups exceeds RFC 7208 limit`);
        if (failDmarc && !r.dmarc?.record) errors.push("Missing _dmarc TXT record");
        if (errors.length) {
          console.error("InboxShield CI gate failed:\n" + errors.map(e => "  - " + e).join("\n"));
          process.exit(1);
        }
        '
